name: "elementary"
version: "0.23.1"

require-dbt-version: [">=1.0.0", "<3.0.0"]

config-version: 2
profile: "elementary"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  mute_ensure_materialization_override: true

models:
  # Fusion evaluates this during `dbt deps` before `target` exists; guard avoids dbt1501 undefined.
  +enabled: "{{ target.type != 'fabric' if target is defined else true }}"

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  - "dbt_modules"

on-run-start:
  - "{{ elementary.on_run_start() if target is defined and target.type != 'fabric' }}"
on-run-end:
  - "{{ elementary.on_run_end() if target is defined and target.type != 'fabric' }}"
